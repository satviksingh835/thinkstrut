[project]
name = "patsearch"
version = "0.1.0"
description = "Hybrid semantic patent search engine (Thinkstruct take-home)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
patsearch = "patsearch.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
